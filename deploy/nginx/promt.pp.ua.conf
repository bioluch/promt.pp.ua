# /etc/nginx/sites-available/promt.pp.ua.conf — JS PROMPT
# Changes vs. the previous version:
#  - /api/ uses "^~" so the static-file regex can no longer serve /api/*.js|json
#    from disk (api/server.js, api/package.json were downloadable)
#  - server-side code, data, docs and tooling (/backups/, /db/, /mail/, /deploy/, /PROMT_PWA_DOCS/,
#    dev servers, *.sql|gz|bak|log|sh|py|conf) return 404
#  - dot-files are blocked except /.well-known/ (Android TWA assetlinks, ACME)
#  - longer timeouts / larger body only where needed (DeepSeek proxy, backups)

server {
    if ($host = www.promt.pp.ua) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = promt.pp.ua) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name promt.pp.ua www.promt.pp.ua;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name promt.pp.ua www.promt.pp.ua;
    ssl_certificate /etc/letsencrypt/live/promt.pp.ua/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/promt.pp.ua/privkey.pem; # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── OCSP stapling ──
   # ssl_stapling on;
   # ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/promt.pp.ua/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    root  /var/www/promt.pp.ua;
    index index.html;

    # Security headers (see note: must be re-included in every location
    # that sets its own add_header, or nginx drops them there)
    include /etc/nginx/snippets/promt-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm font/woff2;
    gzip_min_length 1024;

    # ── Never public: server code, data, backups, tooling ─────────────
    # "^~" / "=" locations win over every regex location below.
    location ^~ /backups/      { return 404; }
    location ^~ /db/           { return 404; }
    location ^~ /mail/         { return 404; }
    location ^~ /deploy/       { return 404; }
    location ^~ /PROMT_PWA_DOCS/ { return 404; }
    location ^~ /node_modules/ { return 404; }
    location = /js/env-server.js { return 404; }
    location = /js/dev-server.js { return 404; }

    # /.well-known/ must stay reachable (Android TWA assetlinks.json, ACME)
    location ^~ /.well-known/ {
        include /etc/nginx/snippets/promt-headers.conf;
        try_files $uri =404;
    }

    # Regex locations are checked in order — the blocking rules come first.
    location ~ /\. { return 404; }                                        # .env, .git, .gitignore …
    location ~* \.(sql|gz|bak|log|sh|py|conf|ini|env|lock)$ { return 404; }

    location = /admin {
        return 301 /admin.html;
    }

    # ── API ───────────────────────────────────────────────────────────
    # Backups: large uploads and long-running pg_dump / psql restore
    location ^~ /api/admin/backup/ {
        include /etc/nginx/snippets/promt-headers.conf;
        client_max_body_size  512m;
        proxy_request_buffering off;
        proxy_pass         http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location ^~ /api/ {
        include /etc/nginx/snippets/promt-headers.conf;
        client_max_body_size 4m;                 # express.json limit is 2 MB
        proxy_pass         http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    180s;              # DeepSeek prompt generation can take > 30 s
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /env { return 404; }

    # Service Worker — never cached, allowed to control root scope
    location = /sw.js {
        include /etc/nginx/snippets/promt-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    # Push client — never cached (so updates propagate immediately)
    location = /push-client.js {
        include /etc/nginx/snippets/promt-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # index.html — always fresh
    location = /index.html {
        include /etc/nginx/snippets/promt-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Static assets with cache
    location ~* \.(js|css|woff2|png|ico|webmanifest|json)$ {
        include /etc/nginx/snippets/promt-headers.conf;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        # All other HTML files — no cache
        location ~* \.html$ {
            include /etc/nginx/snippets/promt-headers.conf;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            try_files $uri =404;
        }
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/promt.pp.ua.access.log;
    error_log  /var/log/nginx/promt.pp.ua.error.log;
}
